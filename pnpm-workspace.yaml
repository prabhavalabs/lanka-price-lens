packages:
  - shared
  - archive
  - foundry
  - api
  - admin
  - web

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - '@hookform/resolvers@5.9.1'
  - '@cloudflare/workers-types@5.20260817.1'

# Security pins for transitive dependencies flagged by `pnpm audit --prod`.
overrides:
  fast-uri: '^3.1.6'
