packages:
  - shared
  - archive
  - foundry
  - notify
  - api
  - mcp
  - admin
  - web

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - '@hookform/resolvers@5.9.1'
  - '@cloudflare/workers-types@5.20260817.1'

# Security pins for transitive dependencies flagged by `pnpm audit --prod`.
overrides:
  fast-uri: '^3.1.6'
  # Reached only through the MCP SDK's HTTP transports, which this workspace does not use (the
  # server speaks stdio), but the audit gate counts every production dependency.
  qs: '^6.16.0'
