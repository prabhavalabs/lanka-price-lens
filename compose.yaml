services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pricelens
      POSTGRES_USER: pricelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricelens -d pricelens"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  api:
    image: ${LPL_IMAGE:-lanka-price-lens:local}
    build:
      context: .
      args:
        VCS_REF: ${LPL_VCS_REF:-local}
    restart: unless-stopped
    init: true
    environment:
      PORT: ${APP_PORT:?set APP_PORT}
      LPL_DATABASE_PATH: /data/operations.sqlite
      LPL_ADMIN_ROOT: /app/admin/dist
      LPL_WEB_ROOT: /app/web/dist
      LPL_ADMIN_HOSTS: ${LPL_ADMIN_HOSTS:-admin.price.prabhavalabs.com,lanka-price-lens.prabhavalabs.com}
      LPL_WEB_HOSTS: ${LPL_WEB_HOSTS:-price.prabhavalabs.com}
      LPL_SOURCE_MANIFEST_PATH: /app/data/manifests/harti_daily_food_prices.json
      LPL_MAPPING_BUNDLE_PATH: /app/data/mappings/harti_daily_food_prices.json
      LPL_MANIFESTS_DIR: /app/data/manifests
      LPL_MAPPINGS_DIR: /app/data/mappings
      LPL_RECIPES_DIR: /app/data/recipes
      LPL_POSTGRES_URL: postgres://pricelens:${POSTGRES_PASSWORD}@postgres:5432/pricelens
      LPL_R2_BUCKET: ${LPL_R2_BUCKET:-lanka-price-lens-pdfs}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      LPL_KEELLS_PROXY_URL: ${LPL_KEELLS_PROXY_URL:-}
      LPL_GA_MEASUREMENT_ID: ${LPL_GA_MEASUREMENT_ID:-}
      LPL_FEEDBACK_EMAIL_TO: ${LPL_FEEDBACK_EMAIL_TO:-}
      LPL_RESEND_API_KEY: ${LPL_RESEND_API_KEY:-}
      LPL_MAIL_FROM: ${LPL_MAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
    ports:
      - "${APP_BIND:?set APP_BIND}:${APP_PORT}:${APP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - operations:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  foundry:
    image: ${LPL_IMAGE:-lanka-price-lens:local}
    build:
      context: .
      args:
        VCS_REF: ${LPL_VCS_REF:-local}
    profiles: [tools]
    init: true
    environment:
      LPL_DATABASE_PATH: /data/operations.sqlite
      LPL_SOURCE_MANIFEST_PATH: /app/data/manifests/harti_daily_food_prices.json
      LPL_MAPPING_BUNDLE_PATH: /app/data/mappings/harti_daily_food_prices.json
      LPL_MANIFESTS_DIR: /app/data/manifests
      LPL_MAPPINGS_DIR: /app/data/mappings
      LPL_RECIPES_DIR: /app/data/recipes
      LPL_POSTGRES_URL: postgres://pricelens:${POSTGRES_PASSWORD}@postgres:5432/pricelens
      LPL_R2_BUCKET: ${LPL_R2_BUCKET:-lanka-price-lens-pdfs}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      LPL_KEELLS_PROXY_URL: ${LPL_KEELLS_PROXY_URL:-}
      LPL_GA_MEASUREMENT_ID: ${LPL_GA_MEASUREMENT_ID:-}
      LPL_FEEDBACK_EMAIL_TO: ${LPL_FEEDBACK_EMAIL_TO:-}
      LPL_RESEND_API_KEY: ${LPL_RESEND_API_KEY:-}
      LPL_MAIL_FROM: ${LPL_MAIL_FROM:-}
    entrypoint: ["node", "foundry/src/cli.ts"]
    volumes:
      - operations:/data
    cpus: "1.00"
    mem_limit: 1536m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  scheduler:
    image: ${LPL_IMAGE:-lanka-price-lens:local}
    build:
      context: .
      args:
        VCS_REF: ${LPL_VCS_REF:-local}
    profiles: [scheduler]
    restart: unless-stopped
    init: true
    environment:
      LPL_DATABASE_PATH: /data/operations.sqlite
      LPL_SOURCE_MANIFEST_PATH: /app/data/manifests/harti_daily_food_prices.json
      LPL_MAPPING_BUNDLE_PATH: /app/data/mappings/harti_daily_food_prices.json
      LPL_MANIFESTS_DIR: /app/data/manifests
      LPL_MAPPINGS_DIR: /app/data/mappings
      LPL_RECIPES_DIR: /app/data/recipes
      LPL_POSTGRES_URL: postgres://pricelens:${POSTGRES_PASSWORD}@postgres:5432/pricelens
      LPL_ARCHIVE_DRIVER: ${LPL_ARCHIVE_DRIVER:-cloudflare}
      LPL_LOCAL_ARCHIVE_ROOT: /archive
      LPL_ENVIRONMENT: ${LPL_ENVIRONMENT:-production}
      LPL_SCHEDULER_ENABLED: ${LPL_SCHEDULER_ENABLED:-true}
      LPL_SCHEDULER_INTERVAL_MS: ${LPL_SCHEDULER_INTERVAL_MS:-15000}
      LPL_R2_BUCKET: ${LPL_R2_BUCKET:-lanka-price-lens-pdfs}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      LPL_KEELLS_PROXY_URL: ${LPL_KEELLS_PROXY_URL:-}
      LPL_GA_MEASUREMENT_ID: ${LPL_GA_MEASUREMENT_ID:-}
      LPL_FEEDBACK_EMAIL_TO: ${LPL_FEEDBACK_EMAIL_TO:-}
      LPL_RESEND_API_KEY: ${LPL_RESEND_API_KEY:-}
      LPL_MAIL_FROM: ${LPL_MAIL_FROM:-}
    entrypoint: ["node", "foundry/src/cli.ts", "scheduler"]
    volumes:
      - operations:/data
      - local_archive:/archive
    cpus: "1.00"
    mem_limit: 1536m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres:
    name: ${LPL_POSTGRES_VOLUME:-lanka-price-lens-postgres}
  operations:
    name: ${LPL_OPERATIONS_VOLUME:-lanka-price-lens-operations}
  local_archive:
    name: ${LPL_LOCAL_ARCHIVE_VOLUME:-lanka-price-lens-local-archive}
