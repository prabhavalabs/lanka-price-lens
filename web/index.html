<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f7a54" />
    <meta name="description" content="Today's food prices across Sri Lanka's open markets and supermarkets, from official bulletins and store shelves, with history." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PriceLens · Sri Lanka food prices today</title>
    <script>
      // Apply the saved theme (or the device's) before the first paint so the page never flashes.
      (function () {
        try {
          var saved = localStorage.getItem("pricelens.theme");
          var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
