# Both sites are served by the one API container, which picks the site by host name
# (LPL_WEB_HOSTS / LPL_ADMIN_HOSTS in compose.yaml). TLS is added on the host by certbot:
#   certbot --nginx -d badumila.com -d www.badumila.com -d admin.badumila.com
server {
    listen 80;
    listen [::]:80;
    server_name badumila.com admin.badumila.com;

    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:8651;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# www is only ever a way in.
server {
    listen 80;
    listen [::]:80;
    server_name www.badumila.com;
    return 301 https://badumila.com$request_uri;
}

# The addresses the site lived at before badumila.com. Pages move for good, with their path and query, so
# bookmarks, search results, and links in mail already sent keep working. /v1/ stays served in place: a
# one-click unsubscribe from an old mail is a POST, and a redirected POST arrives as a GET.
server {
    listen 80;
    listen [::]:80;
    server_name price.prabhavalabs.com;

    client_max_body_size 21m;

    location /v1/ {
        proxy_pass http://127.0.0.1:8651;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        return 301 https://badumila.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.price.prabhavalabs.com;
    return 301 https://admin.badumila.com$request_uri;
}

# The original host keeps working for the deploy health check and old bookmarks; browsers land on the admin.
server {
    listen 80;
    listen [::]:80;
    server_name lanka-price-lens.prabhavalabs.com;

    client_max_body_size 21m;

    location /v1/ {
        proxy_pass http://127.0.0.1:8651;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        return 301 https://admin.badumila.com$request_uri;
    }
}
