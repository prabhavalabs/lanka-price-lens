# Both sites are served by the one API container, which picks the site by host name
# (LPL_WEB_HOSTS / LPL_ADMIN_HOSTS in compose.yaml). TLS is added on the host by certbot.
server {
    listen 80;
    listen [::]:80;
    server_name price.prabhavalabs.com admin.price.prabhavalabs.com;

    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:8651;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# The original host keeps working for the deploy health check and old bookmarks; browsers land on the admin.
server {
    listen 80;
    listen [::]:80;
    server_name lanka-price-lens.prabhavalabs.com;

    client_max_body_size 21m;

    location /v1/ {
        proxy_pass http://127.0.0.1:8651;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        return 301 https://admin.price.prabhavalabs.com$request_uri;
    }
}
